{{define "title"}}
CGN | Events
{{end}}

{{define "content"}}


<form id="eventForm" hx-put="/events/{{ .Event.Id }}/edit" hx-trigger="submit" hx-swap="none" hx-boost="none">

    <!-- Title -->
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" placeholder="{{ .Event.Title }}" required>
    </div>

    <!-- Description -->
    <div>
        <label for="description">Description:</label>
        <textarea id="description" placeholder="{{ .Event.Description }}" name="description"></textarea>
    </div>

    <!-- Start Date and Time -->
    <div>
        <label for="startDateTime">Start Date and Time:</label>
        <input type="datetime-local" placeholder="{{ .Event.StartDateTime }}" id="startDateTime" name="start_date_time" >
    </div>

    <!-- End Date and Time -->
    <div>
        <label for="endDateTime">End Date and Time:</label>
        <input type="datetime-local" placeholder="{{ .Event.EndDateTime }}" id="endDateTime" name="end_date_time" >
    </div>

    <!-- Is Online -->
    <div>
        <label for="isOnline">Is Online:</label>
        <input type="number" placeholder="{{ .Event.IsOnline }}" id="isOnline" name="is_online" >
    </div>

    <!-- Submit Button -->
    <div>
        <button type="submit" >Confirm</button>
    </div>
</form>


{{end}}
