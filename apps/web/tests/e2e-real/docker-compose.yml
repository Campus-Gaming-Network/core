services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cgn_e2e
      POSTGRES_PASSWORD: cgn
      POSTGRES_USER: cgn
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgn -d cgn_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
