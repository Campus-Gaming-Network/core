services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgn}
      POSTGRES_USER: ${POSTGRES_USER:-cgn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgn}
    ports:
      - "5432:5432"
    volumes:
      - cgn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["cgn-migrate", "-dir", "/migrations"]
    environment:
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["cgn-seed", "-csv", "/data/schools_seed.csv"]
    environment:
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
      API_DEV_SEED_USER_EMAIL: ${API_DEV_SEED_USER_EMAIL:-dev@campusgamingnetwork.test}
      API_DEV_SEED_USER_PASSWORD: ${API_DEV_SEED_USER_PASSWORD:-Password12345!}
      API_DEV_SEED_USER_NAME: ${API_DEV_SEED_USER_NAME:-Dev Player}
      API_DEV_SEED_USER_SCHOOL_SLUG: ${API_DEV_SEED_USER_SCHOOL_SLUG:-university-of-california-irvine}
      API_DEV_SEED_USER_TIMEZONE: ${API_DEV_SEED_USER_TIMEZONE:-America/Los_Angeles}
      API_DEV_SEED_USER_FOLLOWED_SCHOOL_SLUGS: ${API_DEV_SEED_USER_FOLLOWED_SCHOOL_SLUGS:-california-state-university-long-beach,arizona-state-university-campus-immersion}
    volumes:
      - ./data/schools_seed.csv:/data/schools_seed.csv:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HTTP_ADDR: ${API_HTTP_ADDR:-:8080}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_CONNECT_TIMEOUT: ${API_DB_CONNECT_TIMEOUT:-2s}
      API_DB_MAX_CONNS: ${API_DB_MAX_CONNS:-10}
      API_CATALOG_REFRESH_INTERVAL: ${API_CATALOG_REFRESH_INTERVAL:-15m}
      API_MAINTENANCE_TOKEN: ${API_MAINTENANCE_TOKEN:-}
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
      API_SESSION_COOKIE: ${API_SESSION_COOKIE:-cgn_session}
      API_SESSION_TTL: ${API_SESSION_TTL:-720h}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      API_VERIFICATION_TTL: ${API_VERIFICATION_TTL:-24h}
      API_RESET_TTL: ${API_RESET_TTL:-1h}
      API_SITE_URL: ${API_SITE_URL:-http://localhost:3000}
      API_RESEND_API_KEY: ${API_RESEND_API_KEY:-}
      API_ACCOUNT_EMAIL_FROM: ${API_ACCOUNT_EMAIL_FROM:-account@campusgamingnetwork.com}
      API_EVENTS_EMAIL_FROM: ${API_EVENTS_EMAIL_FROM:-events@campusgamingnetwork.com}
      API_AUTH_RATE_LIMIT: ${API_AUTH_RATE_LIMIT:-5}
      API_AUTH_RATE_WINDOW: ${API_AUTH_RATE_WINDOW:-15m}
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: ${WEB_API_INTERNAL_URL:-http://api:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cgn-postgres-data:
