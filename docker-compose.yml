services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgn}
      POSTGRES_USER: ${POSTGRES_USER:-cgn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgn}
    ports:
      - "5432:5432"
    volumes:
      - cgn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["cgn-migrate", "-dir", "/migrations"]
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["cgn-seed", "-csv", "/data/schools_seed.csv"]
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
      API_DEV_SEED_USER_EMAIL: ${API_DEV_SEED_USER_EMAIL:-dev@campusgamingnetwork.test}
      API_DEV_SEED_USER_PASSWORD: ${API_DEV_SEED_USER_PASSWORD:-Password12345!}
      API_DEV_SEED_USER_NAME: ${API_DEV_SEED_USER_NAME:-Dev Player}
      API_DEV_SEED_USER_SCHOOL_SLUG: ${API_DEV_SEED_USER_SCHOOL_SLUG:-university-of-california-irvine}
      API_DEV_SEED_USER_TIMEZONE: ${API_DEV_SEED_USER_TIMEZONE:-America/Los_Angeles}
      API_DEV_SEED_USER_FOLLOWED_SCHOOL_SLUGS: ${API_DEV_SEED_USER_FOLLOWED_SCHOOL_SLUGS:-california-state-university-long-beach,arizona-state-university-campus-immersion}
    volumes:
      - ./data/schools_seed.csv:/data/schools_seed.csv:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Fills the local database with thousands of demo users, events, teams, and
  # moderation records. Run with `pnpm run compose:up:demo` or `pnpm run seed:demo`.
  seed-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["cgn-seed", "-csv", "/data/schools_seed.csv", "-demo"]
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
      API_DEMO_SEED_PASSWORD: ${API_DEMO_SEED_PASSWORD:-Password12345!}
    depends_on:
      seed:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      API_HTTP_ADDR: ${API_HTTP_ADDR:-:8080}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_CONNECT_TIMEOUT: ${API_DB_CONNECT_TIMEOUT:-2s}
      API_DB_MAX_CONNS: ${API_DB_MAX_CONNS:-10}
      API_CATALOG_REFRESH_INTERVAL: ${API_CATALOG_REFRESH_INTERVAL:-24h}
      API_MAINTENANCE_TOKEN: ${API_MAINTENANCE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      API_DATABASE_URL: ${API_DATABASE_URL:-postgres://cgn:cgn@postgres:5432/cgn?sslmode=disable}
      API_SESSION_COOKIE: ${API_SESSION_COOKIE:-cgn_session}
      API_SESSION_TTL: ${API_SESSION_TTL:-720h}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      API_VERIFICATION_TTL: ${API_VERIFICATION_TTL:-24h}
      API_RESET_TTL: ${API_RESET_TTL:-1h}
      API_SITE_URL: ${API_SITE_URL:-http://localhost:3000}
      API_RESEND_API_KEY: ${API_RESEND_API_KEY:-}
      API_ACCOUNT_EMAIL_FROM: ${API_ACCOUNT_EMAIL_FROM:-account@campusgamingnetwork.com}
      API_EVENTS_EMAIL_FROM: ${API_EVENTS_EMAIL_FROM:-events@campusgamingnetwork.com}
      API_AUTH_RATE_LIMIT: ${API_AUTH_RATE_LIMIT:-5}
      API_AUTH_RATE_WINDOW: ${API_AUTH_RATE_WINDOW:-15m}
      API_PROXY_SHARED_SECRET: ${API_PROXY_SHARED_SECRET:-local-bff-proxy-secret}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
      ADMIN_API_PROXY_SHARED_SECRET: ${ADMIN_API_PROXY_SHARED_SECRET:-local-admin-bff-proxy-secret-000000}
      ADMIN_SESSION_COOKIE: ${ADMIN_SESSION_COOKIE:-cgn_admin_session}
      ADMIN_CSRF_COOKIE: ${ADMIN_CSRF_COOKIE:-cgn_admin_csrf}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_SESSION_IDLE_TTL: ${ADMIN_SESSION_IDLE_TTL:-30m}
      ADMIN_SESSION_ABSOLUTE_TTL: ${ADMIN_SESSION_ABSOLUTE_TTL:-8h}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_JWKS_URL: ${CLOUDFLARE_ACCESS_JWKS_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-http://object-storage:9090}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_SCHOOL_LOGOS_BUCKET: ${R2_SCHOOL_LOGOS_BUCKET:-cgn-school-logos}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-cgn-local}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-cgn-local-secret}
      R2_PUBLIC_ASSET_ORIGIN: ${R2_PUBLIC_ASSET_ORIGIN:-http://localhost:9090/cgn-school-logos}
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      API_INTERNAL_URL: ${WEB_API_INTERNAL_URL:-http://api:8080}
      API_PROXY_SHARED_SECRET: ${API_PROXY_SHARED_SECRET:-local-bff-proxy-secret}
      API_SESSION_COOKIE: ${API_SESSION_COOKIE:-cgn_session}
      CLOUDFLARE_ORIGIN_SECRET: ${CLOUDFLARE_ORIGIN_SECRET:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      R2_PUBLIC_ASSET_ORIGIN: ${R2_PUBLIC_ASSET_ORIGIN:-http://localhost:9090/cgn-school-logos}
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      WEB_MAINTENANCE_TOKEN: ${WEB_MAINTENANCE_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      ADMIN_API_INTERNAL_URL: ${ADMIN_API_INTERNAL_URL:-http://api:8080}
      ADMIN_API_PROXY_SHARED_SECRET: ${ADMIN_API_PROXY_SHARED_SECRET:-local-admin-bff-proxy-secret-000000}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:3002}
      ADMIN_SESSION_COOKIE: ${ADMIN_SESSION_COOKIE:-cgn_admin_session}
      ADMIN_CSRF_COOKIE: ${ADMIN_CSRF_COOKIE:-cgn_admin_csrf}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_JWKS_URL: ${CLOUDFLARE_ACCESS_JWKS_URL:-}
      ADMIN_LOCAL_ACCESS_EMAIL: ${ADMIN_LOCAL_ACCESS_EMAIL:-}
      R2_PUBLIC_ASSET_ORIGIN: ${R2_PUBLIC_ASSET_ORIGIN:-http://localhost:9090/cgn-school-logos}
      PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local S3-compatible stand-in for the R2 school-logo bucket. It accepts any
  # credentials and serves objects anonymously, as the public asset origin does.
  object-storage:
    profiles: ["admin"]
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${R2_SCHOOL_LOGOS_BUCKET:-cgn-school-logos}
    ports:
      - "127.0.0.1:9090:9090"

  docs:
    profiles: ["docs"]
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    environment:
      DOCS_GIT_LAST_UPDATED: "false"
    ports:
      - "3001:3001"
    volumes:
      - ./docs:/app/docs:ro
      - ./apps/docs/.vitepress/config.mts:/app/apps/docs/.vitepress/config.mts:ro
      - ./apps/docs/.vitepress/theme:/app/apps/docs/.vitepress/theme:ro
      - ./apps/docs/public:/app/apps/docs/public:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cgn-postgres-data:
