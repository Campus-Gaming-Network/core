services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgn}
      POSTGRES_USER: ${POSTGRES_USER:-cgn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgn}
    ports:
      - "5432:5432"
    volumes:
      - cgn-postgres-data:/var/lib/postgresql/data
      - ./db/migrations/000001_foundation.up.sql:/docker-entrypoint-initdb.d/001_foundation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      API_HTTP_ADDR: ${API_HTTP_ADDR:-:8080}
      API_DB_HOST: ${API_DB_HOST:-postgres}
      API_DB_PORT: ${API_DB_PORT:-5432}
      API_DB_CONNECT_TIMEOUT: ${API_DB_CONNECT_TIMEOUT:-2s}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      API_INTERNAL_URL: ${WEB_API_INTERNAL_URL:-http://api:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cgn-postgres-data:
