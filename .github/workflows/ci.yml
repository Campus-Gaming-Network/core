name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_test
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_DATABASE_URL: postgres://cgn:cgn@localhost:5432/cgn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - name: Go version
        working-directory: apps/api
        run: go version
      - name: Format check
        run: npm run fmt:check:api
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Migrate test database
        working-directory: apps/api
        run: go run ./cmd/migrate -dir ../../db/migrations
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    name: TanStack Start web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate application containers
        run: npm run check:apps-compose
      - name: Production container gate
        run: node scripts/web_docker_gate.mjs
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --workspace @campus-gaming-network/web --omit=dev --omit=optional --audit-level=high
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm run test
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Client privacy and framework-boundary scan
        run: npm run privacy:web
      - name: Production HTTP smoke test
        run: npm run smoke:web
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Documentation browser tests
        working-directory: apps/docs
        run: npm run test:e2e
      - name: Development browser tests
        working-directory: apps/web
        run: npm run test:e2e:dev
      - name: Production browser tests
        working-directory: apps/web
        run: npm run test:e2e
