name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: Format check
        run: npm run fmt:check:api
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm run test
      - name: Build
        working-directory: apps/web
        run: npm run build
