name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_test
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_DATABASE_URL: postgres://cgn:cgn@localhost:5432/cgn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          install: false
      - name: Go version
        working-directory: apps/api
        run: go version
      - name: Format check
        run: pnpm run fmt:check:api
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Migrate test database
        working-directory: apps/api
        run: go run ./cmd/migrate -dir ../../db/migrations
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    name: TanStack Start web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Validate application containers
        run: pnpm run check:apps-compose
      - name: Production container gate
        run: node scripts/web_docker_gate.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run fmt:check
      - name: Audit production dependencies
        run: pnpm --filter @campus-gaming-network/web audit --prod --no-optional --audit-level high
      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm run lint
      - name: Test
        working-directory: apps/web
        run: pnpm run test
      - name: Build
        working-directory: apps/web
        run: pnpm run build
      - name: Client privacy and framework-boundary scan
        run: pnpm run privacy:web
      - name: Production HTTP smoke test
        run: pnpm run smoke:web
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Documentation browser tests
        working-directory: apps/docs
        run: pnpm run test:e2e
      - name: Development browser tests
        id: development_browser_tests
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run test:e2e:dev
      - name: Upload development browser failure artifacts
        if: steps.development_browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: development-browser-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Production browser tests
        id: production_browser_tests
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run test:e2e
      - name: Upload production browser failure artifacts
        if: steps.production_browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce browser test results
        if: >-
          steps.development_browser_tests.outcome == 'failure' ||
          steps.production_browser_tests.outcome == 'failure'
        run: exit 1

  real-stack:
    name: Real BFF → Go → Postgres browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_e2e
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REAL_E2E_DATABASE_URL: postgres://cgn:cgn@127.0.0.1:5432/cgn_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run repeatable real-stack browser suite
        run: pnpm run test:e2e:real
