name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

# Jobs only read the repository; none needs to write to it or to packages.
permissions:
  contents: read

# A new push to a pull request replaces the run for the previous push. Runs on
# `main` and `next` are never cancelled, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs pin the runner image instead of using `ubuntu-latest`. The Linux visual
# baselines were generated on this image, and the browser install relies on
# it already having Chromium's shared libraries. Move to a newer image on
# purpose, and regenerate the baselines when doing so.
jobs:
  api:
    name: Go API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_test
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_DATABASE_URL: postgres://cgn:cgn@localhost:5432/cgn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          install: false
      - name: Go version
        working-directory: apps/api
        run: go version
      - name: Format check
        run: pnpm run fmt:check:api
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Migrate test database
        working-directory: apps/api
        run: go run ./cmd/migrate -dir ../../db/migrations
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    name: TanStack Start web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Validate application containers
        run: pnpm run check:apps-compose
      - name: Production container gate
        run: node scripts/web_docker_gate.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run fmt:check
      - name: Documentation link check
        run: pnpm run check:docs-links
      - name: Audit production dependencies
        run: pnpm --filter @campus-gaming-network/web audit --prod --no-optional --audit-level high
      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm run lint
      - name: Test
        working-directory: apps/web
        run: pnpm run test
      - name: Build
        working-directory: apps/web
        run: pnpm run build
      - name: Client privacy and framework-boundary scan
        run: pnpm run privacy:web
      - name: Production HTTP smoke test
        run: pnpm run smoke:web
      - name: Install Playwright browser
        working-directory: apps/web
        # The tests run headless, so only the headless shell is needed. The
        # runner image already has Chromium's shared libraries, and
        # `--with-deps` spent most of this step in `apt`.
        run: pnpm exec playwright install --only-shell chromium
      - name: Documentation browser tests
        working-directory: apps/docs
        run: pnpm run test:e2e

  web-browser:
    # The browser suite runs one test at a time against a shared fake API, so
    # it is split across jobs instead of across workers. Each shard starts its
    # own servers.
    name: Web browser tests (${{ matrix.runtime }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: development, shard: 1, shards: 3 }
          - { runtime: development, shard: 2, shards: 3 }
          - { runtime: development, shard: 3, shards: 3 }
          - { runtime: production, shard: 1, shards: 2 }
          - { runtime: production, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        if: matrix.runtime == 'production'
        working-directory: apps/web
        run: pnpm run build
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --only-shell chromium
      - name: Browser tests
        id: browser_tests
        working-directory: apps/web
        env:
          # Only "development" selects the dev server; anything else serves
          # the production build.
          WEB_BROWSER_RUNTIME: ${{ matrix.runtime }}
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload browser failure artifacts
        if: failure() && steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}-browser-failure-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 7

  admin:
    name: Admin Console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm --filter @campus-gaming-network/admin audit --prod --no-optional --audit-level high
      - name: Typecheck
        working-directory: apps/admin
        run: pnpm run typecheck
      - name: Lint
        working-directory: apps/admin
        run: pnpm run lint
      - name: Unit tests
        working-directory: apps/admin
        run: pnpm run test
      - name: Build
        working-directory: apps/admin
        run: pnpm run build
      - name: Install Playwright browser
        working-directory: apps/admin
        # The tests run headless, so only the headless shell is needed. The
        # runner image already has Chromium's shared libraries, and
        # `--with-deps` spent most of this step in `apt`.
        run: pnpm exec playwright install --only-shell chromium
      - name: Browser tests
        id: browser_tests
        continue-on-error: true
        working-directory: apps/admin
        run: pnpm run test:e2e
      - name: Upload browser failure artifacts
        if: steps.browser_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: admin-browser-failure
          path: |
            apps/admin/test-results
            apps/admin/playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce browser test results
        if: steps.browser_tests.outcome == 'failure'
        run: exit 1

  real-stack:
    name: Real BFF → Go → Postgres browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_e2e
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REAL_E2E_DATABASE_URL: postgres://cgn:cgn@127.0.0.1:5432/cgn_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        # The tests run headless, so only the headless shell is needed. The
        # runner image already has Chromium's shared libraries, and
        # `--with-deps` spent most of this step in `apt`.
        run: pnpm exec playwright install --only-shell chromium
      - name: Run repeatable real-stack browser suite
        run: pnpm run test:e2e:real
      - name: Run Admin Console real-stack suite
        run: pnpm run test:e2e:admin:real
