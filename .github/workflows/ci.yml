name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cgn_test
          POSTGRES_PASSWORD: cgn
          POSTGRES_USER: cgn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cgn -d cgn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_DATABASE_URL: postgres://cgn:cgn@localhost:5432/cgn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - name: Format check
        run: npm run fmt:check:api
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Migrate test database
        working-directory: apps/api
        run: go run ./cmd/migrate -dir ../../db/migrations
      - name: Test
        working-directory: apps/api
        run: go test ./...

  web:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm run test
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Build
        working-directory: apps/web
        run: npm run build
