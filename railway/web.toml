[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [".dockerignore", "apps/docs/package.json", "apps/web/**", "package.json", "package-lock.json", "railway/web.toml"]

[deploy]
startCommand = "node src/production-preflight.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = "10"
